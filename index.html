<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0c12"/>
<title>Orçamento — Victor & Marcela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c12; --surface:#12151f; --surface-2:#171b28; --surface-3:#1d2233;
    --border:#232838; --border-soft:#1a1f2e;
    --text:#eef0f6; --text-dim:#8991b0; --text-faint:#545c78;
    --gold:#e8b84b; --gold-soft:rgba(232,184,75,.14);
    --indigo:#6f7bea; --violet:#9a7ce0; --amberfix:#d68a4a; --teal:#22b4a3;
    --green:#3ad399; --red:#f76a6a; --warn:#f2b84a;
    --wealth:#7dd3fc; --wealth-2:#4f8ff7;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(111,123,234,.10), transparent 45%),
      radial-gradient(circle at 100% 15%, rgba(232,184,75,.07), transparent 40%);
    background-attachment:fixed;
    padding-bottom:28px;
  }
  ::selection{background:var(--gold-soft);}
  .tabular{font-variant-numeric:tabular-nums;}

  /* Header */
  .header{padding:22px 18px 18px; position:relative;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .header-eye{font-size:10.5px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;font-weight:700;font-family:'Sora',sans-serif;}
  .header-title{font-size:22px;font-weight:700;color:#fff;font-family:'Sora',sans-serif;margin-top:3px;letter-spacing:-.2px;}
  .header-period{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .header-badge{font-size:10px;color:var(--text-faint);border:1px solid var(--border);border-radius:20px;padding:4px 10px;white-space:nowrap;}

  /* Hero gauge */
  .hero{display:flex;align-items:center;gap:18px;margin-top:18px;background:linear-gradient(150deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:20px;padding:16px;}
  .gauge-wrap{position:relative;width:92px;height:92px;flex-shrink:0;}
  .gauge-wrap svg{transform:rotate(-90deg);}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-pct{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;}
  .gauge-lbl{font-size:8px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-top:1px;}
  .hero-stats{flex:1;min-width:0;}
  .hero-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .hero-row:last-child{margin-bottom:0;}
  .hero-label{font-size:11px;color:var(--text-dim);}
  .hero-value{font-size:15px;font-weight:700;font-family:'Sora',sans-serif;}

  /* Alert banner */
  .alert-banner{margin:12px 18px 0;background:linear-gradient(120deg,rgba(242,184,74,.12),rgba(242,184,74,.04));border:1px solid rgba(242,184,74,.35);border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;color:var(--warn);display:flex;gap:8px;align-items:flex-start;line-height:1.5;}

  /* Quick add */
  .input-box{padding:14px 18px 0;}
  .input-inner{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border);}
  .input-label{font-size:10.5px;color:var(--gold);margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;font-family:'Sora',sans-serif;}
  .input-row{display:flex;gap:8px;}
  .input-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;color:var(--text);font-size:13.5px;outline:none;font-family:inherit;}
  .input-row input:focus{border-color:var(--gold);}
  .btn-add{background:var(--gold);color:#20160a;border:none;border-radius:var(--radius-sm);padding:11px 19px;font-weight:800;cursor:pointer;font-size:17px;transition:transform .1s;}
  .btn-add:active{transform:scale(.94);}
  .feedback{margin-top:9px;font-size:12px;padding:8px 11px;border-radius:8px;font-weight:500;}
  .fb-ok{background:rgba(58,211,153,.12);color:var(--green);}
  .fb-warn{background:rgba(242,184,74,.12);color:var(--warn);}
  .fb-err{background:rgba(247,106,106,.12);color:var(--red);}

  /* Tabs */
  .tabs{display:flex;padding:16px 18px 0;border-bottom:1px solid var(--border-soft);overflow-x:auto;gap:2px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{background:none;border:none;cursor:pointer;padding:9px 13px;font-size:12px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;font-family:'Sora',sans-serif;transition:color .15s;}
  .tab-btn.active{color:var(--gold);border-bottom:2px solid var(--gold);}
  .content{padding:16px 18px;}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px;}
  .card-header{padding:14px 15px 12px;border-bottom:1px solid var(--border-soft);}
  .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-family:'Sora',sans-serif;}
  .card-totals{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;}
  .card-value{font-size:19px;font-weight:700;font-family:'Sora',sans-serif;}
  .card-of{font-size:11.5px;color:var(--text-dim);}
  .progress-track{background:var(--bg);border-radius:5px;height:5px;margin-top:9px;overflow:hidden;}
  .progress-bar{height:5px;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .progress-track-sm{background:var(--bg);border-radius:3px;height:3px;margin-top:6px;overflow:hidden;}
  .progress-bar-sm{height:3px;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* Fixed rows */
  .fixed-row{padding:12px 15px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s;}
  .fixed-row:hover{background:var(--surface-2);}
  .fixed-row.paid{background:rgba(58,211,153,.04);}
  .fixed-row-left{display:flex;align-items:center;gap:11px;}
  .checkbox{width:19px;height:19px;border-radius:6px;border:2px solid #343b57;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
  .checkbox span{color:#0a0c12;font-size:11px;font-weight:800;display:none;}
  .checkbox.checked span{display:block;}
  .fixed-label{font-size:13px;color:var(--text-dim);}
  .fixed-row.paid .fixed-label{color:var(--text);}
  .fixed-value{font-size:13px;font-weight:600;color:var(--text-dim);font-family:'Sora',sans-serif;}
  .fixed-row.paid .fixed-value{color:var(--text);}
  .edit-btn{font-size:11px;background:var(--surface-3);border:none;color:var(--text-dim);border-radius:6px;padding:4px 8px;cursor:pointer;margin-left:7px;}
  .edit-row{padding:11px 15px;border-bottom:1px solid var(--border-soft);background:#0e111c;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .edit-row input{background:var(--bg);border:1px solid var(--gold);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;outline:none;}
  .edit-row .lbl{flex:2;min-width:120px;}
  .edit-row .val{flex:1;min-width:70px;}
  .save-btn{font-size:11px;background:var(--gold);border:none;color:#20160a;border-radius:6px;padding:6px 11px;cursor:pointer;font-family:inherit;font-weight:700;}
  .del-btn{font-size:11px;background:rgba(247,106,106,.12);border:none;color:var(--red);border-radius:6px;padding:6px 9px;cursor:pointer;font-family:inherit;}

  /* Var rows */
  .var-row{padding:11px 15px;border-bottom:1px solid var(--border-soft);}
  .var-row-top{display:flex;justify-content:space-between;align-items:center;}
  .var-label{font-size:12.5px;color:#c8ccdf;flex:1;}
  .var-value{font-size:12.5px;font-weight:600;font-family:'Sora',sans-serif;}

  .add-row{padding:11px 15px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
  .add-row input{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;}
  .add-row .lbl{flex:2;min-width:100px;}
  .add-row .val{flex:1;min-width:70px;}
  .btn-add-sm{background:var(--surface-3);border:1px solid var(--border);color:var(--gold);border-radius:7px;padding:8px 15px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}

  /* Manual / forms */
  .form-group{margin-bottom:11px;}
  .form-label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:5px;}
  .form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;color:var(--text);font-size:13px;font-family:inherit;outline:none;}
  .form-input:focus{border-color:var(--gold);}
  .btn-submit{width:100%;background:var(--gold);color:#20160a;border:none;border-radius:var(--radius-sm);padding:13px;font-weight:800;cursor:pointer;font-size:14px;font-family:'Sora',sans-serif;margin-top:5px;}
  .btn-submit.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .fixed-note{background:#0e111c;border-radius:9px;padding:11px 13px;margin-bottom:11px;font-size:12px;color:var(--warn);}

  /* History */
  .hist-row{background:var(--surface);border-radius:12px;padding:13px 15px;margin-bottom:8px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .hist-cat{font-size:12.5px;font-weight:600;color:var(--text);}
  .hist-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .hist-date{font-size:10px;color:var(--text-faint);margin-top:2px;}
  .hist-amt{font-weight:700;color:var(--red);font-size:14px;font-family:'Sora',sans-serif;}
  .btn-del{background:rgba(247,106,106,.1);border:none;color:var(--red);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;margin-left:9px;}
  .btn-clear{width:100%;margin-top:9px;background:transparent;border:1px solid rgba(247,106,106,.3);color:var(--red);border-radius:var(--radius-sm);padding:11px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;}
  .empty{text-align:center;color:var(--text-dim);padding:44px 0;font-size:13px;}

  /* Charts */
  .chart-card{padding:15px;}
  .chart-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);font-family:'Sora',sans-serif;margin-bottom:12px;}
  .bar-item{margin-bottom:11px;}
  .bar-item:last-child{margin-bottom:0;}
  .bar-item-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .bar-item-top .n{color:var(--text-dim);}
  .bar-item-top .v{font-weight:700;font-family:'Sora',sans-serif;}
  .bar-track{background:var(--bg);border-radius:5px;height:7px;overflow:hidden;}
  .bar-fill{height:7px;border-radius:5px;background:linear-gradient(90deg,var(--indigo),var(--gold));}

  /* Goals */
  .goal-card{padding:15px;}
  .goal-top{display:flex;justify-content:space-between;align-items:center;}
  .goal-label{font-size:13.5px;font-weight:700;font-family:'Sora',sans-serif;}
  .goal-pct{font-size:12px;font-weight:700;color:var(--gold);font-family:'Sora',sans-serif;}
  .goal-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:9px;}
  .goal-track{background:var(--bg);border-radius:6px;height:8px;margin-top:7px;overflow:hidden;}
  .goal-fill{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .5s;}
  .goal-actions{display:flex;gap:7px;margin-top:12px;}
  .goal-actions button{flex:1;font-size:11.5px;font-weight:700;border-radius:8px;padding:8px;cursor:pointer;font-family:'Sora',sans-serif;border:none;}
  .goal-btn-add{background:var(--gold);color:#20160a;}
  .goal-btn-edit{background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border)!important;}
  .goal-btn-del{background:rgba(247,106,106,.1);color:var(--red);}

  /* Patrimônio */
  .patri-hero{padding:18px;background:linear-gradient(150deg,rgba(125,211,252,.09),var(--surface) 55%);position:relative;}
  .patri-eye{font-size:10px;letter-spacing:1.5px;color:var(--wealth);text-transform:uppercase;font-weight:700;font-family:'Sora',sans-serif;}
  .patri-balance{font-size:28px;font-weight:800;font-family:'Sora',sans-serif;margin-top:5px;background:linear-gradient(90deg,#fff,var(--wealth));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .patri-editbtn{position:absolute;top:16px;right:16px;font-size:11px;background:var(--surface-3);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:5px 10px;cursor:pointer;}
  .patri-stats{display:flex;gap:10px;margin-top:14px;}
  .patri-stat{flex:1;background:#0e111c;border-radius:10px;padding:10px 12px;}
  .patri-stat-lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.8px;}
  .patri-stat-val{font-size:14px;font-weight:700;font-family:'Sora',sans-serif;margin-top:4px;}
  .patri-actions{display:flex;gap:8px;padding:14px 15px;border-top:1px solid var(--border-soft);}
  .patri-actions button{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:'Sora',sans-serif;}
  .btn-resgate{background:rgba(247,106,106,.12);color:var(--red);border:1px solid rgba(247,106,106,.3)!important;}
  .btn-aporte{background:linear-gradient(90deg,var(--wealth-2),var(--wealth));color:#0a1020;}
  .patri-hint{margin:0 0 12px;background:linear-gradient(120deg,rgba(125,211,252,.1),rgba(125,211,252,.03));border:1px solid rgba(125,211,252,.3);border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;color:var(--wealth);display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.5;}
  .patri-hint button{background:var(--wealth);color:#0a1020;border:none;border-radius:7px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Sora',sans-serif;}
  .patri-row{padding:12px 15px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;}
  .patri-row-left{display:flex;align-items:center;gap:10px;}
  .patri-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .patri-desc{font-size:12.5px;font-weight:600;color:var(--text);}
  .patri-date{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .patri-amt{font-weight:700;font-size:13.5px;font-family:'Sora',sans-serif;}
  .patri-form{padding:14px 15px;border-top:1px solid var(--border-soft);background:#0e111c;}
  .patri-form .form-group{margin-bottom:9px;}
  .patri-form-actions{display:flex;gap:8px;margin-top:2px;}
  .patri-form-actions button{flex:1;border:none;border-radius:9px;padding:10px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:'Sora',sans-serif;}
  .patri-confirm{background:var(--wealth);color:#0a1020;}
  .patri-cancel{background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border)!important;}
  .patri-edit-row{padding:12px 15px;border-bottom:1px solid var(--border-soft);background:#0e111c;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .patri-edit-row input{background:var(--bg);border:1px solid var(--wealth);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;outline:none;}
  .patri-edit-row .lbl{flex:2;min-width:120px;}
  .patri-edit-row .val{flex:1;min-width:80px;}
  .carteira-head{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .carteira-name{font-size:13.5px;font-weight:700;font-family:'Sora',sans-serif;display:flex;align-items:center;gap:7px;}
  .carteira-badge{font-size:9px;font-weight:800;background:rgba(125,211,252,.15);color:var(--wealth);padding:2px 6px;border-radius:5px;letter-spacing:.5px;}
  .carteira-sub{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .carteira-balance{font-size:15px;font-weight:700;font-family:'Sora',sans-serif;}
  .rent-pill{font-size:11px;font-weight:700;margin-top:2px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEFAULT_FIXOS = [
  { id:"aluguel",     label:"🏠 Aluguel",              value:5998, group:"fora" },
  { id:"condominio",  label:"🏢 Condomínio",            value:1338, group:"fora" },
  { id:"luz",         label:"💡 Luz",                   value:200,  group:"fora" },
  { id:"internet",    label:"📶 Internet",              value:140,  group:"fora" },
  { id:"plano_saude", label:"🏥 Plano de Saúde Alice",  value:450,  group:"fora" },
  { id:"faxineira",   label:"🧹 Faxineira",             value:800,  group:"fora" },
  { id:"consorcio",   label:"🔑 Consórcio",             value:417,  group:"fora" },
  { id:"cartao_azul", label:"💳 Cartão Azul",           value:838,  group:"fora" },
  { id:"cartao_btg",  label:"💳 Cartão BTG",            value:1700, group:"fora" },
  { id:"total_pass",  label:"🚌 Total Pass Marcela",    value:699,  group:"itau" },
  { id:"seg_carro",   label:"🚗 Seguro Carro",          value:276,  group:"itau" },
  { id:"seg_moto",    label:"🏍️ Seguro Moto",           value:80,   group:"itau" },
  { id:"casquinha",   label:"💰 Casquinha Pix",          value:150,  group:"itau" },
  { id:"unha",        label:"💅 Unha",                  value:480,  group:"itau" },
  { id:"netflix",     label:"🎬 Netflix",               value:30,   group:"itau" },
];
const DEFAULT_VARS = [
  { id:"mercado",          label:"🛒 Mercado / Feira",           budget:1100, group:"itau"  },
  { id:"restaurantes",     label:"🍽️ Restaurantes / Delivery",   budget:500,  group:"itau"  },
  { id:"roupas",           label:"👕 Roupas / Compras Pessoais", budget:500,  group:"itau"  },
  { id:"lazer",            label:"🎭 Lazer / Passeios",          budget:1000, group:"itau"  },
  { id:"farmacia",         label:"💊 Farmácia / Saúde",          budget:350,  group:"itau"  },
  { id:"transporte",       label:"🚗 Transporte / Combustível",  budget:500,  group:"itau"  },
  { id:"imprevistos",      label:"🎯 Reserva / Imprevistos",     budget:0,    group:"itau"  },
  { id:"casa",             label:"🏠 Casa",                      budget:1200, group:"itau"  },
  { id:"almoco",           label:"🥗 Almoço Trabalho e Lanche",  budget:700,  group:"swile" },
  { id:"mercado_marcela",  label:"🛍️ Mercado / Saídas Marcela",  budget:700,  group:"swile" },
];
const STORAGE_KEY = "orcamento_casal_v4";

let state = {
  fixos: JSON.parse(JSON.stringify(DEFAULT_FIXOS)),
  vars:  JSON.parse(JSON.stringify(DEFAULT_VARS)),
  entries: [], paid: {}, tab: "resumo",
  editingFixed: null, editingVar: null,
  feedback: null, manualCat: "mercado",
  incomeItems: [
    { id: "victor", label: "Salário Victor", value: 0 },
    { id: "marcela", label: "Salário Marcela", value: 0 },
  ],
  editingIncome: null,
  goals: [],
  monthlyHistory: [],
  patrimonio: { carteiras: defaultCarteiras() },
  expandedCarteira: null, carteiraAction: null, carteiraActionPreset: null, patriSuggestion: null,
};
function defaultCarteiras(){
  return [
    { id:'avenue', nome:'Avenue', moeda:'USD', history:[], movements:[] },
    { id:'btg_victor', nome:'BTG Victor', moeda:'BRL', history:[], movements:[] },
    { id:'btg_marcela', nome:'BTG Marcela', moeda:'BRL', history:[], movements:[] },
    { id:'galapagos_victor', nome:'Galapagos Victor', moeda:'BRL', history:[], movements:[] },
  ];
}

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { const d=JSON.parse(s); if(d.fixos)state.fixos=d.fixos; if(d.vars)state.vars=d.vars; if(d.entries)state.entries=d.entries; if(d.paid)state.paid=d.paid;
      if(d.goals) state.goals=d.goals;
      if(d.patrimonio && d.patrimonio.carteiras){
        state.patrimonio=d.patrimonio;
      } else if(d.patrimonio && (d.patrimonio.saldoInicial || (d.patrimonio.movements&&d.patrimonio.movements.length))){
        // migração do modelo antigo (patrimônio único) para carteiras
        const legado={id:'legado',nome:'Legado (reclassificar)',moeda:'BRL',
          history:d.patrimonio.saldoInicial?[{date:new Date().toISOString(),saldo:d.patrimonio.saldoInicial}]:[],
          movements:(d.patrimonio.movements||[]).map(m=>({id:m.id,type:m.type,amount:m.amount,note:m.note,date:m.date}))};
        state.patrimonio={carteiras:[legado,...defaultCarteiras()]};
      } else {
        state.patrimonio={carteiras:defaultCarteiras()};
      }
      if(d.incomeItems) state.incomeItems=d.incomeItems;
      else {
        if(d.monthlyIncomeVictor||d.monthlyIncomeMarcela||d.monthlyIncomeExtra) {
          state.incomeItems=[
            {id:"victor",label:"Salário Victor",value:d.monthlyIncomeVictor||0},
            {id:"marcela",label:"Salário Marcela",value:d.monthlyIncomeMarcela||0},
          ];
          if(d.monthlyIncomeExtra) state.incomeItems.push({id:"extra",label:"Extra",value:d.monthlyIncomeExtra});
        }
      }
    }
  } catch(e) {}
  try { state.monthlyHistory = JSON.parse(localStorage.getItem('monthly_history_v1')||'[]'); } catch(e) { state.monthlyHistory=[]; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({fixos:state.fixos,vars:state.vars,entries:state.entries,paid:state.paid,incomeItems:state.incomeItems,goals:state.goals,patrimonio:state.patrimonio})); } catch(e) {}
}
function saveMonthlyHistory(){ try{ localStorage.setItem('monthly_history_v1', JSON.stringify(state.monthlyHistory)); }catch(e){} }
function fmtBRL(v) { return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function getCurrentPeriod() {
  const now=new Date(), day=now.getDate(), m=now.getMonth(), y=now.getFullYear();
  const f=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  return day>=15 ? `${f(new Date(y,m,15))} – ${f(new Date(y,m+1,14))}` : `${f(new Date(y,m-1,15))} – ${f(new Date(y,m,14))}`;
}
function isFixed(id) { return state.fixos.some(f=>f.id===id); }
function getCatLabel(id) { return [...state.fixos,...state.vars].find(c=>c.id===id)?.label||id; }

function parseCat(text) {
  const t=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for (const v of state.vars) {
    const lbl=v.label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/g,"").trim();
    if (lbl && t.includes(lbl)) return v.id;
  }
  for (const f of state.fixos) {
    const lbl=f.label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/g,"").trim();
    if (lbl && t.includes(lbl)) return f.id;
  }
  const map=[
    {id:"mercado",      k:["mercado","feira","supermercado","hortifruti","carrefour","pao de acucar"]},
    {id:"restaurantes", k:["restaurante","delivery","pizza","ifood","refeicao","comida","rappi"]},
    {id:"roupas",       k:["roupa","vestuario","tenis","sapato","calcado","zara","renner"]},
    {id:"lazer",        k:["lazer","passeio","cinema","show","viagem","parque","bar","balada"]},
    {id:"farmacia",     k:["farmacia","remedio","saude","medico","consulta","exame","drogasil"]},
    {id:"transporte",   k:["transporte","combustivel","gasolina","uber","99","onibus","metro","pedagio","posto"]},
    {id:"imprevistos",  k:["imprevisto","reserva","emergencia"]},
    {id:"casa",         k:["casa","decoracao","movel","eletrodomestico","reforma","manutencao"]},
    {id:"almoco",       k:["almoco","lanche trabalho"]},
    {id:"mercado_marcela",k:["mercado marcela","saida marcela"]},
    {id:"aluguel",      k:["aluguel"]},
    {id:"condominio",   k:["condominio"]},
    {id:"luz",          k:["luz","energia","enel","cpfl"]},
    {id:"internet",     k:["internet","claro","vivo"]},
    {id:"plano_saude",  k:["alice","plano saude","plano de saude"]},
    {id:"faxineira",    k:["faxineira","diarista"]},
    {id:"consorcio",    k:["consorcio"]},
    {id:"cartao_azul",  k:["cartao azul"]},
    {id:"cartao_btg",   k:["btg","cartao btg"]},
    {id:"total_pass",   k:["total pass","totalpass"]},
    {id:"seg_carro",    k:["seguro carro"]},
    {id:"seg_moto",     k:["seguro moto"]},
    {id:"casquinha",    k:["casquinha"]},
    {id:"unha",         k:["unha"]},
    {id:"netflix",      k:["netflix","streaming"]},
  ];
  for (const m of map) if(m.k.some(k=>t.includes(k))) return m.id;
  return null;
}
function parseAmt(text) { const m=text.match(/[\d.,]+/); if(!m)return null; return parseFloat(m[0].replace(/\./g,"").replace(",",".")); }

function showFeedback(type,msg) { state.feedback={type,msg}; render(); setTimeout(()=>{state.feedback=null;render();},3000); }

function handleNatural() {
  const el=document.getElementById("natInput"); const text=el.value.trim(); if(!text)return;
  const amt=parseAmt(text), cat=parseCat(text);
  if(!amt&&!cat){showFeedback("err","Não entendi. Tente: 'gastei 150 no mercado'");return;}
  if(cat&&isFixed(cat)){state.paid[cat]=true;saveState();showFeedback("ok","✅ "+getCatLabel(cat)+" marcado como pago");el.value="";render();return;}
  if(!amt){showFeedback("err","Não identifiquei o valor.");return;}
  if(!cat){showFeedback("warn","Categoria não reconhecida. Use a aba Manual.");return;}
  const v=state.vars.find(c=>c.id===cat);
  state.entries.unshift({id:Date.now(),catId:cat,catLabel:v?v.label:cat,amount:amt,description:text,date:new Date().toISOString()});
  saveState(); showFeedback("ok","✅ "+fmtBRL(amt)+" em "+(v?v.label:cat));
  el.value=""; render();
}

// ─── PATRIMÔNIO (carteiras / rentabilidade) ───────────────────
function getPeriodRange(){
  const now=new Date(), day=now.getDate(), m=now.getMonth(), y=now.getFullYear();
  if(day>=15) return {start:new Date(y,m,15), end:new Date(y,m+1,14,23,59,59)};
  return {start:new Date(y,m-1,15), end:new Date(y,m,14,23,59,59)};
}
function carteiraBRL(c,entry){ if(!entry) return 0; return c.moeda==='USD' ? (entry.saldo*(entry.cotacao||0)) : entry.saldo; }
function carteiraCurrentBRL(c){ return c.history.length ? carteiraBRL(c,c.history[c.history.length-1]) : 0; }
function carteiraRentabilidade(c){
  if(c.history.length<2) return null;
  const prev=c.history[c.history.length-2], curr=c.history[c.history.length-1];
  const prevBRL=carteiraBRL(c,prev), currBRL=carteiraBRL(c,curr);
  const netFlow=c.movements.filter(m=>{const d=new Date(m.date);return d>new Date(prev.date)&&d<=new Date(curr.date);})
    .reduce((s,m)=>s+(m.type==='aporte'?m.amount:-m.amount),0);
  const rendimento=currBRL-prevBRL-netFlow;
  return {rendimento, pct: prevBRL>0?(rendimento/prevBRL*100):null, prevBRL, currBRL};
}
function consolidado(){
  let total=0, sumRend=0, sumPrev=0, resgatesPeriodo=0, aportesPeriodo=0;
  const {start,end}=getPeriodRange();
  state.patrimonio.carteiras.forEach(c=>{
    total+=carteiraCurrentBRL(c);
    const r=carteiraRentabilidade(c);
    if(r && r.prevBRL>0){ sumRend+=r.rendimento; sumPrev+=r.prevBRL; }
    c.movements.forEach(m=>{const d=new Date(m.date); if(d>=start&&d<=end){ if(m.type==='resgate') resgatesPeriodo+=m.amount; else aportesPeriodo+=m.amount; }});
  });
  return {total, pct: sumPrev>0?(sumRend/sumPrev*100):null, resgatesPeriodo, aportesPeriodo};
}
function toggleCarteira(id){ state.expandedCarteira = state.expandedCarteira===id?null:id; state.carteiraAction=null; render(); }
function openCarteiraAction(carteiraId, type, preset){
  state.expandedCarteira=carteiraId;
  state.carteiraAction={carteiraId,type};
  state.carteiraActionPreset=preset||null;
  render();
  setTimeout(()=>{const el=document.getElementById('carteiraSaldoInput')||document.getElementById('carteiraAmtInput'); if(el) el.focus();},30);
}
function cancelCarteiraAction(){ state.carteiraAction=null; state.carteiraActionPreset=null; render(); }
function confirmCarteiraAction(){
  const {carteiraId,type}=state.carteiraAction;
  const c=state.patrimonio.carteiras.find(x=>x.id===carteiraId); if(!c)return;
  if(type==='saldo'){
    const saldo=parseFloat((document.getElementById('carteiraSaldoInput')||{value:''}).value.replace(',','.'));
    if(isNaN(saldo)||saldo<0){showFeedback('err','Valor de saldo inválido.');return;}
    let cot=null;
    if(c.moeda==='USD'){
      cot=parseFloat((document.getElementById('carteiraCotInput')||{value:''}).value.replace(',','.'));
      if(isNaN(cot)||cot<=0){showFeedback('err','Informe a cotação do dólar.');return;}
    }
    c.history.push({date:new Date().toISOString(), saldo, cotacao:cot});
    state.carteiraAction=null;
    saveState();showFeedback('ok','📊 Saldo de '+c.nome+' atualizado');render();return;
  }
  const v=parseFloat((document.getElementById('carteiraAmtInput')||{value:''}).value.replace(',','.'));
  if(!v||v<=0){showFeedback('err','Informe um valor válido.');return;}
  const note=(document.getElementById('carteiraNoteInput')||{value:''}).value.trim()||(type==='resgate'?'Resgate':'Aporte');
  c.movements.push({id:Date.now(),type,amount:v,note,date:new Date().toISOString()});
  state.carteiraAction=null; state.carteiraActionPreset=null; state.patriSuggestion=null;
  saveState();
  showFeedback('ok',(type==='resgate'?'💸 Resgate':'💰 Aporte')+' de '+fmtBRL(v)+' em '+c.nome+' registrado');
  render();
}
function undoLastSaldo(carteiraId){
  const c=state.patrimonio.carteiras.find(x=>x.id===carteiraId); if(!c||!c.history.length)return;
  if(!confirm('Remover o último registro de saldo de '+c.nome+'?'))return;
  c.history.pop();
  saveState();render();
}
function deleteCarteiraMov(carteiraId, movId){
  const c=state.patrimonio.carteiras.find(x=>x.id===carteiraId); if(!c)return;
  if(!confirm('Remover este lançamento?'))return;
  c.movements=c.movements.filter(m=>m.id!==movId);
  saveState();render();
}

// ─── RENDER ──────────────────────────────────────────────────
function render(){
  const ff=state.fixos.filter(f=>f.group==="fora");
  const fi=state.fixos.filter(f=>f.group==="itau");
  const vi=state.vars.filter(v=>v.group==="itau");
  const vs=state.vars.filter(v=>v.group==="swile");
  const totals={};state.vars.forEach(c=>totals[c.id]=0);
  state.entries.forEach(e=>{if(totals[e.catId]!==undefined)totals[e.catId]+=e.amount;});
  const tIV=vi.reduce((s,c)=>s+totals[c.id],0), tIO=vi.reduce((s,c)=>s+c.budget,0);
  const tSV=vs.reduce((s,c)=>s+totals[c.id],0), tSO=vs.reduce((s,c)=>s+c.budget,0);
  const tFFO=ff.reduce((s,f)=>s+f.value,0), tFFP=ff.filter(f=>state.paid[f.id]).reduce((s,f)=>s+f.value,0);
  const tFIO=fi.reduce((s,f)=>s+f.value,0), tFIP=fi.filter(f=>state.paid[f.id]).reduce((s,f)=>s+f.value,0);
  const grand=tFFP+tFIP+tIV+tSV, grandOrc=tFFO+tFIO+tIO+tSO;
  const gPct=grandOrc>0?Math.round((grand/grandOrc)*100):0, gOver=grand>grandOrc;
  const receita=state.incomeItems.reduce((s,i)=>s+Number(i.value||0),0);
  const resultado=receita-grand;

  const allVarCats=[...vi,...vs];
  const nearLimit=allVarCats.filter(c=>{const g=totals[c.id]||0; return c.budget>0 && g/c.budget>=0.9;});

  const circ=2*Math.PI*38;
  const dash=Math.min(gPct,100)/100*circ;
  const gaugeColor=gOver?'var(--red)':(gPct>=85?'var(--warn)':'var(--gold)');

  document.getElementById("app").innerHTML=`
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-eye">Painel Financeiro</div>
        <div class="header-title">Victor & Marcela</div>
        <div class="header-period">📅 ${getCurrentPeriod()}</div>
      </div>
      <div class="header-badge">${resultado>=0?'✅ no azul':'⚠️ no vermelho'}</div>
    </div>
    <div class="hero">
      <div class="gauge-wrap">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="38" fill="none" stroke="#1d2233" stroke-width="8"/>
          <circle cx="46" cy="46" r="38" fill="none" stroke="${gaugeColor}" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-pct tabular" style="color:${gaugeColor}">${gPct}%</div>
          <div class="gauge-lbl">usado</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-row"><span class="hero-label">Gasto no período</span><span class="hero-value tabular" style="color:${gOver?'var(--red)':'#fff'}">${fmtBRL(grand)}</span></div>
        <div class="hero-row"><span class="hero-label">Orçamento total</span><span class="hero-value tabular" style="color:var(--text-dim);font-size:13px">${fmtBRL(grandOrc)}</span></div>
        <div class="hero-row"><span class="hero-label">Resultado do mês</span><span class="hero-value tabular" style="color:${resultado>=0?'var(--green)':'var(--red)'}">${resultado>=0?'+':''}${fmtBRL(resultado)}</span></div>
      </div>
    </div>
  </div>
  ${nearLimit.length?`<div class="alert-banner">⚠️ <div><b>${nearLimit.length} categoria${nearLimit.length>1?'s':''}</b> perto ou acima do limite: ${nearLimit.map(c=>c.label).join(', ')}</div></div>`:''}
  <div class="input-box"><div class="input-inner">
    <div class="input-label">Lançamento rápido</div>
    <div class="input-row">
      <input id="natInput" placeholder='"gastei 150 no mercado" ou "paguei aluguel"' onkeydown="if(event.key==='Enter')handleNatural()"/>
      <button class="btn-add" onclick="handleNatural()">+</button>
    </div>
    ${state.feedback?`<div class="feedback fb-${state.feedback.type}">${state.feedback.msg}</div>`:""}
  </div></div>
  <div class="tabs">
    ${[["resumo","Resumo"],["fixos","Fixos"],["variaveis","Variáveis"],["metas","Metas"],["patrimonio","Patrimônio"],["manual","Manual"],["historico","Histórico"]].map(([t,l])=>
      `<button class="tab-btn ${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${l}</button>`).join("")}
  </div>
  <div class="content">
    ${state.tab==="resumo"   ? renderResumo(ff,fi,vi,vs,totals,tIV,tIO,tSV,tSO,tFFO,tFFP,tFIO,tFIP,receita,grand,resultado):""}
    ${state.tab==="fixos"    ? renderFixos(ff,fi,tFFO,tFFP,tFIO,tFIP):""}
    ${state.tab==="variaveis"? renderVars(vi,vs,totals,tIV,tIO,tSV,tSO):""}
    ${state.tab==="metas"    ? renderGoals():""}
    ${state.tab==="patrimonio"?renderPatrimonio():""}
    ${state.tab==="manual"   ? renderManual():""}
    ${state.tab==="historico"? renderHist():""}

function renderTrendChart(){
  const hist=[...state.monthlyHistory].slice(0,6).reverse();
  if(hist.length<2) return `<div class="card chart-card"><div class="chart-title">Tendência Mensal</div>
    <div style="font-size:12px;color:var(--text-faint);padding:8px 0">Feche pelo menos 2 meses para ver a evolução do resultado aqui.</div></div>`;
  const vals=hist.map(m=>parseFloat(String(m.resultado).replace(/\./g,'').replace(',','.'))||0);
  const max=Math.max(...vals,1), min=Math.min(...vals,0);
  const range=(max-min)||1;
  const w=280,h=70,pad=6;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(w-2*pad);
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${vals[i]>=0?'#3ad399':'#f76a6a'}"/>`).join('');
  return `<div class="card chart-card">
    <div class="chart-title">Tendência Mensal — Resultado</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:70px;overflow:visible">
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8b84b" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#trendGrad)"/>
      <path d="${line}" fill="none" stroke="#e8b84b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div style="display:flex;justify-content:space-between;margin-top:6px">
      ${hist.map(m=>`<span style="font-size:9px;color:var(--text-faint)">${(m.month||'').split(' ')[0].slice(0,3)}</span>`).join('')}
    </div>
  </div>`;
}

function renderTopCategories(vi,vs,totals){
  const cats=[...vi,...vs].map(c=>({label:c.label,val:totals[c.id]||0})).filter(c=>c.val>0).sort((a,b)=>b.val-a.val).slice(0,5);
  if(!cats.length) return '';
  const max=Math.max(...cats.map(c=>c.val),1);
  return `<div class="card chart-card">
    <div class="chart-title">Maiores Gastos do Período</div>
    ${cats.map(c=>`<div class="bar-item">
      <div class="bar-item-top"><span class="n">${c.label}</span><span class="v tabular">${fmtBRL(c.val)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.val/max)*100}%"></div></div>
    </div>`).join('')}
  </div>`;
}

        <button class="btn-del" onclick="deleteCarteiraMov('${c.id}',${m.id})">✕</button>
      </div>
    </div>`).join('') : `<div style="padding:14px 15px;font-size:11.5px;color:var(--text-faint)">Nenhum resgate ou aporte registrado.</div>`;

  return `<div class="card">
    <div class="carteira-head" onclick="toggleCarteira('${c.id}')">
      <div>
        <div class="carteira-name">${c.nome} ${c.moeda==='USD'?'<span class="carteira-badge">USD</span>':''}</div>
        <div class="carteira-sub">${lastEntry?('Atualizado em '+new Date(lastEntry.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+(c.moeda==='USD'?(' · US$ '+lastEntry.saldo.toLocaleString('en-US',{minimumFractionDigits:2})+' @ R$ '+lastEntry.cotacao):'')):'Nenhum saldo registrado'}</div>
      </div>
      <div style="text-align:right">
        <div class="carteira-balance tabular">${fmtBRL(bal)}</div>
        <div class="rent-pill tabular" style="color:${rentColor}">${rentStr}</div>
      </div>
    </div>
    ${expanded ? `
    <div class="patri-actions" style="border-top:1px solid var(--border-soft)">
      <button class="btn-aporte" style="background:var(--surface-3);color:var(--wealth);border:1px solid var(--border)" onclick="openCarteiraAction('${c.id}','saldo')">📊 Atualizar Saldo</button>
      <button class="btn-resgate" onclick="openCarteiraAction('${c.id}','resgate')">💸 Resgate</button>
      <button class="btn-aporte" onclick="openCarteiraAction('${c.id}','aporte')">💰 Aporte</button>
    </div>
    ${actionForm}
    ${lastEntry?`<div style="padding:0 15px 12px"><button onclick="undoLastSaldo('${c.id}')" style="background:none;border:none;color:var(--text-faint);font-size:10.5px;cursor:pointer;text-decoration:underline">↩ desfazer última atualização de saldo</button></div>`:''}
    <div style="border-top:1px solid var(--border-soft)">${movsList}</div>
    ` : ''}
  </div>`;
}

function renderManual(){
  const allFixed=state.fixos, allVars=state.vars;
  const isF=isFixed(state.manualCat);
  const allIds=[...allFixed,...allVars].map(c=>c.id);
  if(!allIds.includes(state.manualCat)) state.manualCat=allVars[0]?.id||allFixed[0]?.id;
  return `<div class="card" style="padding:16px">
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase">Adicionar manualmente</div>
    <div class="form-group"><label class="form-label">Categoria</label>
      <select class="form-input" onchange="state.manualCat=this.value;render()">
        <optgroup label="── Fixos fora do cartão">${state.fixos.filter(f=>f.group==="fora").map(f=>`<option value="${f.id}" ${state.manualCat===f.id?'selected':''}>${f.label} (${fmtBRL(f.value)})</option>`).join("")}</optgroup>
        <optgroup label="── Itaú Fixos">${state.fixos.filter(f=>f.group==="itau").map(f=>`<option value="${f.id}" ${state.manualCat===f.id?'selected':''}>${f.label} (${fmtBRL(f.value)})</option>`).join("")}</optgroup>
        <optgroup label="── Itaú Variáveis">${state.vars.filter(v=>v.group==="itau").map(v=>`<option value="${v.id}" ${state.manualCat===v.id?'selected':''}>${v.label}</option>`).join("")}</optgroup>
        <optgroup label="── Swile">${state.vars.filter(v=>v.group==="swile").map(v=>`<option value="${v.id}" ${state.manualCat===v.id?'selected':''}>${v.label}</option>`).join("")}</optgroup>
      </select>
    </div>
    ${isF?`<div class="fixed-note">⚡ Item fixo — será marcado como pago.</div>`:`
    <div class="form-group"><label class="form-label">Valor (R$)</label>
      <input id="manAmt" class="form-input" placeholder="0,00"/>
    </div>`}
    <div class="form-group"><label class="form-label">Descrição (opcional)</label>
      <input id="manDesc" class="form-input" placeholder="ex: Carrefour sábado"/>
    </div>
    <button class="btn-submit" onclick="handleManualAdd()">${isF?"Marcar como pago":"Adicionar"}</button>
    ${state.feedback?`<div class="feedback fb-${state.feedback.type}" style="margin-top:10px">${state.feedback.msg}</div>`:""}
  </div>`;
}

function exportBackup(){
  const data={fixos:state.fixos,vars:state.vars,entries:state.entries,paid:state.paid,incomeItems:state.incomeItems,goals:state.goals,patrimonio:state.patrimonio,monthlyHistory:state.monthlyHistory,_exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download="backup_orcamento_"+stamp+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showFeedback("ok","⬇️ Backup exportado");
}
function triggerImport(){ document.getElementById("importFileInput").click(); }
function importBackupFile(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(!confirm("Isso vai substituir todos os dados atuais pelo conteúdo desse backup. Continuar?")) return;
      if(d.fixos)state.fixos=d.fixos;
      if(d.vars)state.vars=d.vars;
      if(d.entries)state.entries=d.entries;
      if(d.paid)state.paid=d.paid;
      if(d.incomeItems)state.incomeItems=d.incomeItems;
      if(d.goals)state.goals=d.goals;
      if(d.patrimonio)state.patrimonio=d.patrimonio;
      if(d.monthlyHistory)state.monthlyHistory=d.monthlyHistory;
      saveState(); saveMonthlyHistory();
      showFeedback("ok","✅ Backup importado com sucesso");
      render();
    }catch(err){ showFeedback("err","Arquivo inválido."); }
  };
  reader.readAsText(file);
  event.target.value="";
}

function renderHist(){
  let top='<div class="card" style="padding:15px;margin-bottom:12px">'
    +'<div class="chart-title" style="margin-bottom:10px">💾 Backup dos dados</div>'
    +'<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:11px;line-height:1.5">Seus dados ficam salvos só neste iPhone/navegador. Exporte um backup de vez em quando para não perder nada.</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn-submit" style="margin-top:0" onclick="exportBackup()">⬇️ Exportar</button>'
    +'<button class="btn-submit ghost" style="margin-top:0" onclick="triggerImport()">⬆️ Importar</button>'
    +'</div>'
    +'<input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="importBackupFile(event)"/>'
    +'</div>';
  top+='<div class="card" style="padding:13px;margin-bottom:12px"><button class="btn-submit" onclick="closeMonth()">📦 Fechar Mês</button></div>';
  if(state.monthlyHistory.length){
    top+='<div class="card" style="padding:15px;margin-bottom:12px"><div class="chart-title">Histórico Mensal</div>';
    const totalResultado=state.monthlyHistory.reduce((s,m)=>s+(parseFloat(String(m.resultado).replace(',','.'))||0),0);
    top+='<div style="margin:2px 0 12px 0;font-weight:700;font-family:Sora,sans-serif" class="tabular">Resultado acumulado: '+fmtBRL(totalResultado)+'</div>';
    top+=state.monthlyHistory.map((m,i)=>`<div style="padding:11px 0;border-bottom:1px solid var(--border-soft)">
      <b style="font-family:Sora,sans-serif;font-size:13px">${m.month}</b><br>
      <span style="font-size:12px;color:var(--text-dim)">Receita: R$ ${m.receita}</span><br>
      <span style="font-size:12px;color:var(--text-dim)">Resultado: ${m.resultado}</span><br>
      <span style="color:var(--text-faint);font-size:11.5px">${m.obs||''}</span>
      <div style="margin-top:8px"><button class="edit-btn" onclick="editMonthlyHistory(${i})">✏️ Editar</button><button class="del-btn" onclick="deleteMonthlyHistory(${i})">🗑 Excluir</button></div>
    </div>`).join('');
    top+='</div>';
  }
  if(!state.entries.length) return top+`<div class="empty">Nenhum lançamento variável ainda.</div>`;
  return top+state.entries.map(e=>`<div class="hist-row">
    <div><div class="hist-cat">${e.catLabel}</div><div class="hist-desc">${e.description}</div>
    <div class="hist-date">${new Date(e.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></div>
    <div style="display:flex;align-items:center"><span class="hist-amt tabular">−${fmtBRL(e.amount)}</span>
    <button class="btn-del" onclick="removeEntry(${e.id})">✕</button></div>
  </div>`).join("")+`<button class="btn-clear" onclick="clearEntries()">Limpar lançamentos</button>`;
}

loadState(); render();
</script>
